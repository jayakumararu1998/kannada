name: Docker Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: xmediaadmin/jayakamermigroservice

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker tag from branch + commit message
        id: tag
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)

          # Convert to lowercase
          TAG=$(echo "$COMMIT_MESSAGE" | tr '[:upper:]' '[:lower:]')

          # Replace spaces and invalid characters with -
          TAG=$(echo "$TAG" | sed 's/[^a-z0-9._-]/-/g')

          # Remove repeated -
          TAG=$(echo "$TAG" | sed 's/-\+/-/g')

          # Remove leading/trailing -
          TAG=$(echo "$TAG" | sed 's/^-//;s/-$//')

          # Limit length to 80 characters (leave room for branch prefix)
          TAG=$(echo "$TAG" | cut -c1-80)

          # Fallback if tag becomes empty
          if [ -z "$TAG" ]; then
            TAG="build-${GITHUB_SHA::7}"
          fi

          # Prefix with branch name to avoid collisions across branches
          FULL_TAG="${BRANCH_NAME}-${TAG}"

          # Build final tag list: always the commit tag; add "latest" only on main
          TAGS="${IMAGE_NAME}:${FULL_TAG}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS}$(printf '\n')${IMAGE_NAME}:latest"
          fi

          echo "Docker tag: $FULL_TAG"
          echo "TAGS<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tag.outputs.TAGS }}
